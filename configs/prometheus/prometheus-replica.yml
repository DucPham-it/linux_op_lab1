global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: 'kbt-monitoring'
    replica: 'prometheus-b'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - "recording_rules.yml"
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9091"]

  - job_name: "node_exporter"
    scrape_interval: 5s
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/*.json'
        refresh_interval: 5s
